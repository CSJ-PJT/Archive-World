name: glTF Validator Fixtures
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate_gltf.mjs'
      - 'scripts/test_gltf_validator.mjs'
      - 'tools/gltf-validator/**'
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/gltf-validator
      - run: npm test --prefix tools/gltf-validator
